name: orbit_tap
description: Private vault app for hiding images, videos, contacts, and app shortcuts.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.7.0
  device_apps: ^2.2.0
  file_picker: ^8.1.2
  flutter_contacts: ^1.1.9+2
  gallery_saver_plus: ^3.2.9
  intl: ^0.19.0
  path: ^1.9.0
  path_provider: ^2.1.4
  photo_manager: ^3.8.3
  shared_preferences: ^2.3.2
  syncfusion_flutter_pdfviewer: ^28.2.12
  uuid: ^4.5.1
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

