name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Print Flutter version
        run: flutter --version

      - name: Generate Android platform files
        run: flutter create . --platforms android --org com.orbittap.app

      - name: Install dependencies
        run: flutter pub get

      - name: Patch device_apps Android config
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          matches = list(Path.home().glob('.pub-cache/hosted/pub.dev/device_apps-*/android/build.gradle'))
          if not matches:
              raise SystemExit('device_apps build.gradle not found in pub cache')

          gradle_file = matches[0]
          content = gradle_file.read_text()

          if 'namespace ' not in content:
              content = content.replace(
                  'android {',
                  "android {\n    namespace 'fr.g123k.deviceapps'",
                  1,
              )

          content = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 34', content)
          content = re.sub(r'targetSdkVersion\s+\d+', 'targetSdkVersion 34', content)

          gradle_file.write_text(content)
          print(f'Patched {gradle_file}')
          PY

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbit-tap-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
