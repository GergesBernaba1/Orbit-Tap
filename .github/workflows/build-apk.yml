name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Print Flutter version
        run: flutter --version

      - name: Generate Android platform files
        run: flutter create . --platforms android --org com.orbittap.app

      - name: Patch generated Android project
        run: python .github/scripts/patch_generated_android.py

      - name: Install dependencies
        run: flutter pub get

      - name: Patch device_apps Android config
        run: python .github/scripts/patch_device_apps.py

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbit-tap-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
